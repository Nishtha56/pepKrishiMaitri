services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin@mongo:27017/krishimaitri?authSource=admin
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:80,http://localhost:5173,http://localhost:8081
      LOVABLE_API_KEY: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENWEATHER_API_KEY: ""
      DATA_GOV_API_KEY: ""
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo-data:
